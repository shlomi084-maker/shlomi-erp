# Shlomi ERP — local n8n for development and the exam demo.
#
# Only n8n runs here. Airtable, Gemini, Gmail, Drive, Telegram and the Lovable app stay in the cloud.
# Variables come from .env in this folder (the same file the scripts in scripts/ read).
#
#   docker compose up -d                      # n8n on http://localhost:5678
#   docker compose --profile tunnel up -d     # + Cloudflare tunnel, needed for Telegram / Lovable / landing page
#   docker compose --profile quicktunnel up -d   # or: temporary trycloudflare.com URL, no account needed
#   docker compose logs -f n8n
#   docker compose down                       # data survives in the n8n_data volume
#
# Then: N8N_URL=http://localhost:5678 (or the tunnel URL) in .env, create an API key in
# n8n (Settings -> n8n API), and run scripts/airtable_setup.py -> n8n_import.py -> load_rag.py -> smoke_test.py.

name: shlomi-erp

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    container_name: shlomi-erp-n8n
    restart: unless-stopped
    ports:
      # localhost only; the outside world reaches n8n through the tunnel service
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Jerusalem
      - TZ=Asia/Jerusalem
      # Public base URL. Telegram triggers and the Lovable app need HTTPS here (the tunnel hostname).
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - N8N_EDITOR_BASE_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - N8N_PROXY_HOPS=${N8N_PROXY_HOPS:-0}
      # Encrypts stored credentials. Losing it means re-entering all 6 credentials.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Keep the execution log small: one week
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Optional. A Cloudflare named tunnel gives a stable HTTPS hostname (set its public hostname
  # to http://n8n:5678 in the Cloudflare dashboard and put the same URL in N8N_WEBHOOK_URL).
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: shlomi-erp-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      n8n:
        condition: service_healthy

  # Optional, no Cloudflare account needed: a random https://<words>.trycloudflare.com URL that
  # changes on every restart (read it with `docker compose logs quicktunnel`). Good for testing.
  quicktunnel:
    image: cloudflare/cloudflared:latest
    container_name: shlomi-erp-quicktunnel
    profiles: ["quicktunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://n8n:5678
    depends_on:
      n8n:
        condition: service_healthy

volumes:
  n8n_data:
